<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brush Up Stores</title>
    <meta
      name="description"
      content="Brush Up Storesは旭川市のカット専門店です。予約不要でご来店いただけます。一般カットは1,700円、平日はキッズ・65才以上の方は1,300円です。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Space+Mono:wght@400;700&family=Dancing+Script:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <img
        class="store-logo"
        src="../assets/icons/logo1_transparent.png"
        alt="Brush Up Storesのロゴ"
      />
      <a
        class="scroll-cue"
        href="#top-nav"
        aria-label="下へスクロールして続ける"
      >
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="var(--ink)"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 9l6 6 6-6" />
        </svg>
      </a>
    </header>

    <nav id="top-nav" class="nav">
      <img
        class="nav-logo"
        src="../assets/icons/logo1_transparent.png"
        alt="Brush Up Storesのロゴ"
      />

      <div class="lang-switcher">
        <button type="button" data-lang-choice="ja">日本語</button>
        <span aria-hidden="true">/</span>
        <button type="button" data-lang-choice="en">EN</button>
      </div>

      <button
        class="hamburger"
        type="button"
        aria-label="ナビゲーションメニュー"
        data-i18n-aria-label="nav.toggle"
        aria-expanded="false"
        aria-controls="nav-menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="navlinks" id="nav-menu">
        <div class="navmid">
          <a href="#menu" data-i18n="nav.menu"></a>
          <a href="#hours" data-i18n="nav.hours"></a>
          <a href="#access" data-i18n="nav.location"></a>
          <a href="./about-us/" data-i18n="nav.about"></a>
        </div>

        <a
          class="ig-btn"
          href="https://www.instagram.com/make_u_happy916/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="../assets/icons/instagram.svg"
            alt="Instagramアイコン"
            width="50"
            height="50"
          />
        </a>
      </div>
    </nav>

    <main>
      <section class="haircuts">
        <div class="card">
          <img
            src="../assets/images/kid_1.jpg"
            alt="カット前の男の子"
            class="photo"
          />
          <img
            src="../assets/icons/right-arrow.png"
            alt=""
            class="arrow-icon right"
          />
          <img
            src="../assets/icons/down-arrow.png"
            alt=""
            class="arrow-icon down"
          />
          <img
            src="../assets/images/kid_2.jpg"
            alt="カット後の男の子"
            class="photo"
          />
        </div>

        <div class="card">
          <img
            src="../assets/images/cut_before.jpg"
            alt="カット前のお客様"
            class="photo"
          />
          <img
            src="../assets/icons/right-arrow.png"
            alt=""
            class="arrow-icon right"
          />
          <img
            src="../assets/icons/down-arrow.png"
            alt=""
            class="arrow-icon down"
          />
          <img
            src="../assets/images/cut_after.jpg"
            alt="カット後のお客様"
            class="photo"
          />
        </div>
      </section>

      <section id="menu" class="menu-showcase">
        <div class="menu-inner">
          <div class="menu-heading" aria-labelledby="menu-title">
            <div class="menu-ribbon">
              <h2 id="menu-title" data-i18n="menu.heading"></h2>
            </div>
          </div>
          <div class="store-message">
            <h3 data-i18n="walk-in"></h3>
          </div>

          <div class="menu-cards">
            <article class="menu-price-card">
              <img
                class="menu-service-icon menu-service-icon--scissors"
                src="../assets/icons/scissors.png"
                alt=""
                aria-hidden="true"
              />

              <h3 data-i18n="menu.regular.heading"></h3>

              <p class="menu-description" data-i18n="menu.regular.detail"></p>

              <div class="menu-divider" aria-hidden="true"></div>

              <span
                    class="menu-price-label menu-price-label--weekday"
                    data-i18n="menu.discount.everyday"
              >
              </span>

              <p class="menu-main-price">¥1,700</p>
            </article>

            <article class="menu-price-card">
              <img
                class="menu-service-icon menu-service-icon--child"
                src="../assets/icons/baby-boy.png"
                alt=""
                aria-hidden="true"
              />

              <h3 data-i18n="menu.discount.heading"></h3>

              <p class="menu-description" data-i18n="menu.discount.detail"></p>

              <div class="menu-divider" aria-hidden="true"></div>

              <div class="menu-split-prices">
                <div class="menu-split-price">
                  <span
                    class="menu-price-label menu-price-label--weekday"
                    data-i18n="menu.discount.weekday"
                  ></span>
                  <span class="menu-small-price">¥1,300</span>
                </div>

                <div class="menu-split-price">
                  <span
                    class="menu-price-label menu-price-label--holiday"
                    data-i18n="menu.discount.holiday"
                  ></span>
                  <span class="menu-small-price">¥1,700</span>
                </div>
              </div>
            </article>

            <article class="menu-price-card">
              <img
                class="menu-service-icon menu-service-icon--clipper"
                src="../assets/icons/clipper.png"
                alt=""
                aria-hidden="true"
              />

              <h3 data-i18n="menu.buzz.heading"></h3>

              <p class="menu-description" data-i18n="menu.buzz.detail"></p>

              <div class="menu-divider" aria-hidden="true"></div>

              <span
                class="menu-price-label menu-price-label--weekday"
                data-i18n="menu.discount.everyday"
              >
              </span>
              <p class="menu-main-price">¥1,300</p>
            </article>
          </div>

          <p class="menu-note" data-i18n="menu.footer"></p>
        </div>
      </section>

      <section id="access" class="location-showcase">
        <div class="location-inner">
          <div class="location-heading">
            <h2 data-i18n="nav.location"></h2>
          </div>

          <div class="location-grid">
            <div class="location-map">
              <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2881.0994017313683!2d142.3777612!3d43.7707954!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5f0ce7f96d5d7889%3A0xb6bbfc9ca90c7adc!2sBrush%20up%20Stores!5e0!3m2!1sen!2sjp!4v1788163502687!5m2!1sen!2sjp"
                width="600"
                height="450"
                style="border: 0"
                loading="lazy"
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"
                title="Google Maps上のBrush Up Storesの場所"
              >
              </iframe>
            </div>

            <div class="location-card">
              <h3>Brush Up Stores</h3>
              <img
                src="../assets/images/outside_1_wide.jpeg"
                alt="店舗の外観"
                id="outside-front"
              />
              <p class="location-address" data-i18n="location.address"></p>

              <a
                class="location-map-button"
                href="https://maps.app.goo.gl/r3s4brdBbsNuGYCR6"
                target="_blank"
                rel="noopener noreferrer"
                data-i18n="location.link"
              >
                <span aria-hidden="true">▶</span>
              </a>
            </div>
          </div>
        </div>
      </section>

      <section id="hours" class="hours-showcase">
        <div class="hours-inner">
          <img
            class="hours-awning"
            src="../assets/icons/store_awning.png"
            alt=""
            aria-hidden="true"
          />

          <div class="hours-panel">
            <div class="hours-heading">
              <div class="hours-ribbon">
                <h2 data-i18n="hours.heading"></h2>
              </div>
            </div>

            <div class="hours-content">
              <div class="hours-storefront" aria-hidden="true">
                <img
                  class="hours-storefront-image"
                  src="../assets/icons/storefront.png"
                  alt=""
                />
              </div>

              <div class="hours-schedule">
                <div class="hours-row">
                  <div class="hours-day hours-day--weekday">
                    <span class="hours-dot"></span>
                    <span data-i18n="hours.weekdays"></span>
                  </div>

                  <div class="hours-time">
                    <time datetime="09:00">9:00</time>
                    <span>–</span>
                    <time datetime="18:30">18:30</time>
                  </div>
                </div>

                <div class="hours-row">
                  <div class="hours-day hours-day--saturday">
                    <span class="hours-dot"></span>
                    <span data-i18n="hours.sat"></span>
                  </div>

                  <div class="hours-time">
                    <time datetime="09:00">9:00</time>
                    <span>–</span>
                    <time datetime="17:00">17:00</time>
                  </div>
                </div>

                <div class="hours-row">
                  <div class="hours-day hours-day--holiday">
                    <span class="hours-dot"></span>
                    <span data-i18n="hours.sun"></span>
                  </div>

                  <div class="hours-time">
                    <time datetime="09:00">9:00</time>
                    <span>–</span>
                    <time datetime="15:00">15:00</time>
                  </div>
                </div>
              </div>
            </div>

            <a
              class="hours-instagram"
              href="https://www.instagram.com/make_u_happy916/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Brush Up Storesの最新営業カレンダーをInstagramで確認する"
            >
              <img
                class="hours-instagram-icon"
                src="../assets/icons/instagram.svg"
                alt=""
                aria-hidden="true"
                width="82"
                height="82"
              />

              <div class="hours-instagram-text">
                <strong data-i18n="hours.link.bold"></strong>
                <span data-i18n="hours.link.regular"></span>
              </div>

              <span class="hours-instagram-arrow" aria-hidden="true">▶</span>
            </a>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="wrap">
        <div class="foot-grid">
          <div>
            <div class="foot-logo">Brush up Stores</div>
            <p class="foot-desc" data-i18n="walk-in"></p>
          </div>
          <div class="foot-links">
            <div class="foot-col icon-credits">
              <h4>Attributions</h4>
              <a
                href="https://www.flaticon.com/free-icon/clipper_3331475"
                target="_blank"
                rel="noopener noreferrer"
                data-i18n="attributions.clipper"
              >
              </a>
              <a
                href="https://www.flaticon.com/free-icon/baby-boy_3282468"
                target="_blank"
                rel="noopener noreferrer"
                data-i18n="attributions.child"
              >
              </a>
              <a
                href="https://www.flaticon.com/free-icon/scissors_2542051"
                target="_blank"
                rel="noopener noreferrer"
                data-i18n="attributions.scissors"
              >
              </a>
            </div>
          </div>
        </div>
        <div class="foot-bottom">
          <span>&copy; 2026 Brush up Stores</span>
        </div>
      </div>
    </footer>
  </body>
</html>
